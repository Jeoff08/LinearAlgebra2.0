<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/Logo(2).png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MathWorkspace" />
    <meta name="theme-color" content="#166534" />
    <meta name="description" content="Interactive Linear Algebra and Calculus Workspace with 25+ calculators, step-by-step problem solvers, quizzes, and learning materials." />
    <link rel="manifest" href="/manifest.json" />
    <title>MathWorkspace • Linear Algebra & Calculus</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("app_theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.add("light");
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overflow-x-hidden min-h-screen bg-white text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
